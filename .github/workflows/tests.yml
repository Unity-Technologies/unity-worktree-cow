name: tests

# Synthetic fixtures only - no Unity, no real project - so this runs on stock
# GitHub-hosted runners in seconds. ubuntu (ext4) and windows (NTFS) cannot
# block-clone, so they exercise the REFUSAL paths; macOS (APFS) can. The
# linux-cow job runs the clone paths on Linux, on loopback btrfs, XFS and ZFS
# volumes. Harnesses that need Unity are instruments, not gates, and are
# deliberately not here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    name: bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show environment
        shell: bash
        run: |
          uname -a
          bash --version | head -1
          git --version
      - name: Run the suite
        shell: bash
        run: bash tests/run-tests.sh

  linux-cow:
    name: bash (ubuntu, ${{ matrix.fs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, xfs, zfs]
    steps:
      - uses: actions/checkout@v4
      - name: Make a loopback ${{ matrix.fs }} volume
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/cow
          truncate -s 4G "$RUNNER_TEMP/cow.img"
          case "${{ matrix.fs }}" in
            btrfs)
              sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs
              sudo mkfs.btrfs -q "$RUNNER_TEMP/cow.img"
              sudo mount -o loop "$RUNNER_TEMP/cow.img" /mnt/cow ;;
            xfs)
              sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs
              sudo mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/cow.img"
              sudo mount -o loop "$RUNNER_TEMP/cow.img" /mnt/cow ;;
            zfs)
              sudo apt-get update -qq && sudo apt-get install -y -qq zfsutils-linux
              sudo modprobe zfs
              cat /sys/module/zfs/version
              # Off by default in some 2.2.x releases; the pool feature alone is not enough.
              if [ -e /sys/module/zfs/parameters/zfs_bclone_enabled ]; then
                echo 1 | sudo tee /sys/module/zfs/parameters/zfs_bclone_enabled
              fi
              sudo zpool create -O mountpoint=/mnt/cow cowtest "$RUNNER_TEMP/cow.img" ;;
          esac
          sudo chown "$USER" /mnt/cow
          df -T /mnt/cow
      - name: Run the suite
        shell: bash
        run: bash tests/run-tests.sh /mnt/cow
